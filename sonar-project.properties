# =====================================================================
# 組織與專案資訊設定
# =====================================================================
sonar.organization=ggz2468
sonar.projectKey=ggz2468_shop-api
sonar.projectName=鈞弘電子商務

# =====================================================================
# 程式碼與測試路徑設定
# =====================================================================
# 需要分析的後端程式碼資料夾
sonar.sources=app,config,routes,database/migrations

# 測試程式所在目錄
sonar.tests=tests

# 排除不需要分析的目錄（例如第三方套件、快取、語系檔等），避免浪費額度與時間
sonar.exclusions=vendor/**, storage/**, bootstrap/cache/**, resources/lang/**, public/**, node_modules/**

# =====================================================================
# 測試覆蓋率報告設定
# =====================================================================
# 指定 GitHub Actions 中 php artisan test 產出的 Clover XML 報告路徑
sonar.php.coverage.reportPaths=coverage.xml

# =====================================================================
# 進階語系與編碼設定
# =====================================================================
sonar.sourceEncoding=UTF-8
